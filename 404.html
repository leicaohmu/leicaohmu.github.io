<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 | Lei Laboratory</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #8C1515 0%, #006B81 100%);
            color: white;
            position: relative;
        }
        
        .error-page::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            animation: float 6s ease-in-out infinite;
        }
        
        .error-page::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -100px;
            left: -100px;
            animation: float 8s ease-in-out infinite reverse;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }
        
        .error-content {
            position: relative;
            z-index: 1;
            max-width: 600px;
        }
        
        .error-content h1 {
            font-size: 10rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.3);
            line-height: 1;
            animation: slideDown 0.8s ease-out;
        }
        
        .error-content h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 700;
            animation: fadeIn 1s ease-out 0.3s both;
        }
        
        .error-content p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0.95;
            line-height: 1.7;
            animation: fadeIn 1s ease-out 0.6s both;
        }
        
        .error-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.9s both;
        }
        
        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 36px;
            background: white;
            color: #8C1515;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 16px;
        }
        
        .error-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .error-btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 2px solid white;
            backdrop-filter: blur(10px);
        }
        
        .error-btn-secondary:hover {
            background: white;
            color: #8C1515;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .error-content h1 {
                font-size: 6rem;
            }
            .error-content h2 {
                font-size: 1.5rem;
            }
            .error-content p {
                font-size: 1rem;
            }
            .error-buttons {
                flex-direction: column;
            }
            .error-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <h1>404</h1>
            <h2>页面未找到 / Page Not Found</h2>
            <p>
                抱歉，您访问的页面不存在或已被移动<br>
                Sorry, the page you are looking for does not exist or has been moved
            </p>
            <div class="error-buttons">
                <a href="/" class="error-btn">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 3L3 10L10 17M3 10H17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>返回首页 / Back to Home</span>
                </a>
                <a href="javascript:history.back()" class="error-btn error-btn-secondary">
                    <span>返回上一页 / Go Back</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
