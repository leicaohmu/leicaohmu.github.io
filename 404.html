<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - Lei Laboratory</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .error-content h1 {
            font-size: 8rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .error-content h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .error-content p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .error-btn {
            display: inline-block;
            padding: 14px 32px;
            background: white;
            color: #2c3e50;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .error-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        @media (max-width: 768px) {
            .error-content h1 {
                font-size: 5rem;
            }
            .error-content h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <h1>404</h1>
            <h2>页面未找到 / Page Not Found</h2>
            <p>抱歉，您访问的页面不存在<br>Sorry, the page you are looking for does not exist</p>
            <a href="/" class="error-btn">返回首页 / Back to Home</a>
        </div>
    </div>
</body>
</html>
